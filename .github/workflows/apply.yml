# Despliegue real de una etapa con Workload Identity Federation (ADR-0004).
# Se lanza a mano desde Actions > Apply > Run workflow, después de mergear.
#
# Variables del repo (Settings > Secrets and variables > Actions > Variables):
#   APPLY_ENABLED           'true' para permitir despliegues
#   WIF_PROVIDER            output wif_provider de 0-bootstrap
#   STAGE_SERVICE_ACCOUNTS  output stage_service_accounts de 0-bootstrap (JSON)
#   TFSTATE_BUCKET          output tfstate_bucket de 0-bootstrap
#   GCP_PREFIX              prefijo usado en 0-bootstrap
#   GCP_BILLING_ACCOUNT     cuenta de facturación
#   GCP_ADMIN_MEMBERS       JSON, por ejemplo ["user:diego@empresa.com"]
name: Apply

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Etapa
        required: true
        type: choice
        options: [1-org, 2-security, 3-networks]
      action:
        description: Acción
        required: true
        type: choice
        default: plan
        options: [plan, apply]
      enable_hybrid:
        description: Crear el HA VPN (solo 3-networks)
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: apply-${{ inputs.stage }}
  cancel-in-progress: false

env:
  TF_VERSION: 1.11.4
  TF_IN_AUTOMATION: "true"
  TF_VAR_tfstate_bucket: ${{ vars.TFSTATE_BUCKET }}
  TF_VAR_prefix: ${{ vars.GCP_PREFIX }}
  TF_VAR_billing_account: ${{ vars.GCP_BILLING_ACCOUNT }}
  TF_VAR_admin_members: ${{ vars.GCP_ADMIN_MEMBERS }}
  TF_VAR_enable_hybrid: ${{ inputs.enable_hybrid }}

jobs:
  terraform:
    name: ${{ inputs.action }} ${{ inputs.stage }}
    if: vars.APPLY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: plataforma
    defaults:
      run:
        working-directory: stages/${{ inputs.stage }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ fromJSON(vars.STAGE_SERVICE_ACCOUNTS)[fromJSON('{"1-org":"org","2-security":"security","3-networks":"networks"}')[inputs.stage]] }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: init
        run: terraform init -input=false -backend-config="bucket=${TF_VAR_tfstate_bucket}"

      - name: plan
        run: terraform plan -input=false -out=tfplan

      - name: apply
        if: inputs.action == 'apply'
        run: terraform apply -input=false tfplan
